<html>
    <head>
        <title>Formulário</title>
    </head>
    <body>
        <h2>Formulário de contato</h2>
        <form action="obrigado.html" method="post">
            <label>Digite o seu nome:</label>
            <input type="text" name="nome" required/><br>
            <label>Seu telefone:</label>
            <input type="tel" nome="telefone" required/><br>
            <label>E-mail:</label>
            <input type="email" name="email"/><br>
            <label>Avalie nosso site:</label>
            <input type="range" min="0" max="5"/><br>
            <label>Escolha o seu curso</label>
            <input type="radio" name="curso" value="ADS">
            <label>ADS</label>
            <input type="radio" name="curso" value="Ciência da Computação">
            <label>Ciência da Computação</label>
            <input type="radio" name="curso" value="Eng. Software">
            <label>Engenharia de Software</label>
            <input type="radio" name="curso" value="Eng. Computação">
            <label>Engenharia da Computação</label>
            <input type="radio" name="curso" value="Ciência de Dados">
            <label>Ciência de Dados</label><br>
            <button value="Enviar">Enviar</button>
        </form>
    </body>
</html>
